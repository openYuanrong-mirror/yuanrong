      RRT_BIN="\$\$(pwd)/artifacts/openyuanrong-rrt/rrt-runtime-arm64"
      RRT_BUILD_ARCH=arm64 RRT_OUTPUT="\$\$RRT_BIN" bash scripts/build_rrt_runtime.sh
      ( cd api/python-rrt && RRT_RUNTIME_SRC="\$\$RRT_BIN" BUILD_VERSION="\$\$YR_BUILD_VERSION" python3 setup.py bdist_wheel -d "\$\$OLDPWD/artifacts/openyuanrong-rrt" )
      ( cd artifacts/openyuanrong-rrt && sha256sum openyuanrong_rrt-*.whl rrt-runtime-* > SHA256SUMS )
      ls -lh artifacts/openyuanrong-rrt/
      ( cd artifacts/openyuanrong-rrt && buildkite-agent artifact upload "openyuanrong_rrt-*.whl" )
      bash .buildkite/upload_buildkite_packages.sh artifacts/openyuanrong-rrt/openyuanrong_rrt-*.whl || true
      bash .buildkite/upload_obs_artifacts.sh \
        --output artifacts/openyuanrong-rrt/obs-urls-rrt.txt \
        --platform linux \
        --arch "\$\${BUILD_ARCH:-x86_64}" \
        --channel "\$\$OBS_UPLOAD_CHANNEL" \
        \$\$OBS_UPLOAD_VERSION_ARGS \
        -- artifacts/openyuanrong-rrt/openyuanrong_rrt-*.whl artifacts/openyuanrong-rrt/rrt-runtime-* artifacts/openyuanrong-rrt/SHA256SUMS
    agents:
      queue: "default"
      os: "linux"
      linux_arch: "arm64"
    plugins:
      - kubernetes:
          podSpec:
            nodeSelector:
              kubernetes.io/arch: arm64
            imagePullSecrets:
              - name: swr-pull-secret
            containers:
              - image: "$RRT_ARM64_BUILDER_IMAGE"
                volumeMounts:
                  - name: build-cache
                    mountPath: /mnt/paas
                resources:
                  requests: { cpu: "16", memory: "16Gi" }
                  limits: { cpu: "16", memory: "16Gi" }
                env:
                  - name: OBS_ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        name: obs-credentials
                        key: AK
                        optional: true
                  - name: OBS_SECRET_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: obs-credentials
                        key: SK
                        optional: true
                  - name: BUILDKITE_PACKAGE_UPLOAD_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: buildkite-package-credentials
                        key: api-token
                        optional: true
            volumes:
              - name: build-cache
                hostPath:
                  path: /mnt/paas
                  type: DirectoryOrCreate
    timeout_in_minutes: 90
YAML
fi

if ! is_enabled "${ENABLE_RRT_ONLY}"; then
if is_enabled "${ENABLE_SANDBOX_PACKAGE}" && is_enabled "${ENABLE_SANDBOX_MANIFEST}"; then
cat << YAML
  - label: ":package: Build Image arm"
    key: "publish-sandbox-release-arm64"
    depends_on:
      - "build-all-arm64"${SANDBOX_ARM_RRT_DEPENDS}${SANDBOX_ARM64_DATA_PLANE_DEPENDS}
    command: |
      set -e
      export PATH="/workspace:\$\$PATH"
      bash .buildkite/package_sandbox_release.sh
    env:
      BUILDKITE_AGENT_NAME: "agent-stack-k8s"
      SANDBOX_BUILD_STEP_KEY: "build-all-arm64"
      SANDBOX_DATA_PLANE_GATEWAY_STEP_KEY: "build-data-plane-gateway-arm64"
      YR_K8S_PYTHON_VERSION: "3.9.18"
      YR_K8S_PYTHON_MAJOR_MINOR: "3.9"
      YR_K8S_IMAGE_ARCH: "arm64"
      YR_K8S_IMAGE_PLATFORM: "linux/arm64"
      YR_K8S_IMAGE_CACHE: "1"
      YR_K8S_IMAGE_CACHE_TAG: "build-cache-arm64"
      YR_K8S_DOCKER_BUILDKIT: "0"
    agents:
      queue: "default"
      os: "linux"
      linux_arch: "arm64"
    plugins:
      - kubernetes:
          podSpec:
            nodeSelector:
              kubernetes.io/arch: arm64
            imagePullSecrets:
              - name: swr-pull-secret
            containers:
              - image: "$BUILDER_IMAGE"
                securityContext:
                  privileged: true
                volumeMounts:
                  - name: docker-graph
                    mountPath: /var/lib/docker
                resources:
                  requests: { cpu: "8", memory: "16Gi" }
                  limits: { cpu: "8", memory: "16Gi" }
                env:
                  - name: OBS_ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        name: obs-credentials
                        key: AK
                        optional: true
                  - name: OBS_SECRET_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: obs-credentials
                        key: SK
                        optional: true
                  - name: SWR_USERNAME
                    valueFrom:
                      secretKeyRef:
                        name: swr-credentials
                        key: username
                        optional: true
                  - name: SWR_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: swr-credentials
                        key: password
                        optional: true
                  - name: SWR_DOCKER_CONFIG_JSON
                    valueFrom:
                      secretKeyRef:
                        name: swr-pull-secret
                        key: .dockerconfigjson
                        optional: true
            volumes:
              - name: docker-graph
                emptyDir:
                  sizeLimit: 80Gi
    timeout_in_minutes: 120
YAML

fi
if is_enabled "${ENABLE_SANDBOX_PACKAGE}" && is_enabled "${ENABLE_SANDBOX_MANIFEST}"; then
cat << YAML

  - label: ":package: Build Manifest"
    key: "publish-sandbox-manifest"
    depends_on:
${SANDBOX_MANIFEST_RELEASE_DEPENDS}
${SANDBOX_MANIFEST_SANDBOX_SDK_DEPENDS}
    command: |
      set -e
      export PATH="/workspace:\$\$PATH"
      bash .buildkite/package_sandbox_manifest.sh
    env:
      BUILDKITE_AGENT_NAME: "agent-stack-k8s"
      SANDBOX_RRT_ARTIFACT_STEPS: "${SANDBOX_RRT_ARTIFACT_STEPS}"
      YR_K8S_MANIFEST_ARCHES: "${SANDBOX_MANIFEST_ARCHES}"
      SANDBOX_SANDBOX_SDK_STEPS: "${SANDBOX_SANDBOX_SDK_STEPS}"
      SANDBOX_EXTRA_ARTIFACT_STEPS: ""
    agents:
      queue: "default"
      os: "linux"
      arch: "amd64"
    plugins:
      - kubernetes:
          podSpec:
            imagePullSecrets:
              - name: swr-pull-secret
            containers:
              - image: "$SANDBOX_PACKAGER_IMAGE"
                resources:
                  requests: { cpu: "1", memory: "1Gi" }
                  limits: { cpu: "2", memory: "2Gi" }
                env:
                  - name: SWR_USERNAME
                    valueFrom:
                      secretKeyRef:
                        name: swr-credentials
                        key: username
                        optional: true
                  - name: SWR_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: swr-credentials
                        key: password
                        optional: true
                  - name: SWR_DOCKER_CONFIG_JSON
                    valueFrom:
                      secretKeyRef:
                        name: swr-pull-secret
                        key: .dockerconfigjson
                        optional: true
                  - name: OBS_ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        name: obs-credentials
                        key: AK
                        optional: true
                  - name: OBS_SECRET_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: obs-credentials
                        key: SK
                        optional: true
    timeout_in_minutes: 30
YAML
fi
fi
;;
esac


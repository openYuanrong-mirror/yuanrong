fullnameOverride: yr

global:
  dataSystem:
    enabled: true
    bypass: false
  runtime:
    forceLowReliabilityInstance: false
  namespace:
    create: true
    name: yr-k8s
  cluster:
    id: cluster001
    name: yr-k8s
    region: local
    azId: local-az1
  imageRegistry: docker.io
  imagePullSecrets: []
  commonLabels: {}
  images:
    controlplane:
      repository: yr-controlplane
      tag: latest
      pullPolicy: IfNotPresent
    node:
      repository: yr-node
      tag: latest
      pullPolicy: IfNotPresent
    runtime:
      repository: yr-runtime
      tag: latest
      pullPolicy: IfNotPresent
    traefik:
      registry: docker.io
      repository: traefik
      tag: v2.11.14
      pullPolicy: IfNotPresent
  runtimeImages:
    cp39: {}
    cp310: {}
    cp311: {}
    cp312: {}
    cp313: {}
    cp314: {}
  externalEtcd:
    addrList: ""
    metaStoreAddress: ""
  services:
    servicesYaml: |
      - service: defaultservice
        kind: yrlib
        description: this is the default service
        functions:
          default:
            timeout: 900
            cpu: 500
            memory: 500
            runtime: python3.11
            concurrentNum: 20
          py39:
            timeout: 900
            cpu: 500
            memory: 500
            runtime: python3.9
            concurrentNum: 20
          py311:
            timeout: 900
            cpu: 500
            memory: 500
            runtime: python3.11
            concurrentNum: 20
            rootfs:
              runtime: runc
              type: image
              imageurl: {{ include "yr-k8s.runtimeImage" (dict "root" . "suffix" "cp311") | quote }}
              readonly: true
              mountpoint: /mnt
            bootstrap:
              type: path
              root: "/"
              entrypoint: "python -m yr.cli.scripts runtime_main"
          py310:
            timeout: 900
            cpu: 500
            memory: 500
            runtime: python3.10
            concurrentNum: 20
            rootfs:
              runtime: runc
              type: image
              imageurl: {{ include "yr-k8s.runtimeImage" (dict "root" . "suffix" "cp310") | quote }}
              readonly: true
              mountpoint: /mnt
            bootstrap:
              type: path
              root: "/"
              entrypoint: "python -m yr.cli.scripts runtime_main"
          py312:
            timeout: 900
            cpu: 500
            memory: 500
            runtime: python3.12
            concurrentNum: 20
            rootfs:
              runtime: runc
              type: image
              imageurl: {{ include "yr-k8s.runtimeImage" (dict "root" . "suffix" "cp312") | quote }}
              readonly: true
              mountpoint: /mnt
            bootstrap:
              type: path
              root: "/"
              entrypoint: "python -m yr.cli.scripts runtime_main"
          # rrt = dedicated Rust sandbox backend (native rrt-runtime), the k8s
          # analog of the docker AIO rrt slot. The frontend create API selects
          # the rrt slot directly; the runtime field is still propagated as
          # YR_LANGUAGE for runtime-side language dispatch.
          # Dockerfile.runtime installs the platform-specific
          # openyuanrong-rrt wheel and exposes its native binary as
          # /usr/local/bin/rrt-runtime.
          # RRT_HTTP_PORT / RRT_TUNNEL_* are injected by frontend create when needed.
          rrt:
            timeout: 900
            cpu: 500
            memory: 500
            runtime: rust
            concurrentNum: 20
            rootfs:
              runtime: runc
              type: image
              imageurl: {{ include "yr-k8s.runtimeImage" (dict "root" . "suffix" "cp310") | quote }}
              readonly: true
              mountpoint: /mnt
            bootstrap:
              type: path
              root: "/"
              entrypoint: "rrt-runtime"
          py313:
            timeout: 900
            cpu: 500
            memory: 500
            runtime: python3.13
            concurrentNum: 20
            rootfs:
              runtime: runc
              type: image
              imageurl: {{ include "yr-k8s.runtimeImage" (dict "root" . "suffix" "cp313") | quote }}
              readonly: true
              mountpoint: /mnt
            bootstrap:
              type: path
              root: "/"
              entrypoint: "python -m yr.cli.scripts runtime_main"
          py314:
            timeout: 900
            cpu: 500
            memory: 500
            runtime: python3.14
            concurrentNum: 20
            rootfs:
              runtime: runc
              type: image
              imageurl: {{ include "yr-k8s.runtimeImage" (dict "root" . "suffix" "cp314") | quote }}
              readonly: true
              mountpoint: /mnt
            bootstrap:
              type: path
              root: "/"
              entrypoint: "python -m yr.cli.scripts runtime_main"
          java:
            timeout: 900
            cpu: 500
            memory: 500
            runtime: java1.8
            concurrentNum: 20
          cpp:
            timeout: 900
            cpu: 500
            memory: 500
            runtime: cpp11
            concurrentNum: 20
  systemFunctions:
    faasFrontend:
      cpu: 500
      memory: 500
      # The sandbox chart runs frontend as a component driver. Keep this at 0 so bootstrap restores function metadata
      # without creating additional managed system-function instances.
      instanceNum: 0
    faasScheduler:
      cpu: 500
      memory: 500
      # The sandbox chart runs scheduler as a component driver. Keep this at 0 so bootstrap restores function metadata
      # without creating additional managed system-function instances.
      instanceNum: 0
  secrets:
    s3AccessKey: ""
    s3SecretKey: ""
    curveSecret: ""
    # Hex-encoded component data key used by iam-server to sign and verify internal JWT tokens.
    litebusDataKey: ""

etcd:
  enabled: true
  replicaCount: 1
  image:
    registry: swr.cn-southwest-2.myhuaweicloud.com/openyuanrong
    repository: etcd
    tag: 20260420-183500-reset
    pullPolicy: IfNotPresent
  dataDir: /etcd
  service:
    type: ClusterIP
    port: 2379
  persistence:
    enabled: false
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  resources: {}
  probes:
    readiness:
      tcpSocket:
        port: client
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 1
      failureThreshold: 3
    liveness:
      tcpSocket:
        port: client
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3

master:
  enabled: true
  replicaCount: 1
  serviceAccount:
    create: true
    name: ""
  service:
    ports:
      master: 22770
      metaService: 31111
      iamServer: 31112
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  probes:
    readiness:
      tcpSocket:
        port: master
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    liveness:
      tcpSocket:
        port: master
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3

frontend:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8888
    targetPort: 8888
    # Legacy Go sandboxRouter listen port. It remains available only when the
    # standalone data plane is disabled; Frontend never proxies to Rust Edge.
    routerPort: 8080
    annotations: {}
    # Edge reaches Frontend over Pod loopback. Keep the legacy Service absent
    # while Edge is enabled unless an internal compatibility client needs it.
    exposeWhenEdgeEnabled: false
  iamServerAddress: ""
  # Legacy sandboxRouter used by the old /direct path while dataPlane is off.
  sandboxRouter:
    enabled: true
    rrtPort: 50090
    enableJwt: true
    validateIam: true
  faasFrontend:
    httpPort: 8888
  envPorts:
    functionProxyPort: 22772
    functionProxyGrpcPort: 22773
    dsWorkerPort: 31501
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  probes:
    readiness:
      tcpSocket:
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    liveness:
      tcpSocket:
        port: http
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3

# Standalone Rust data plane. Disabled in the generic chart so production must
# explicitly choose TLS/CIDR policy. The Buildkite smoke overlay enables an
# isolated h2c deployment and verifies that traffic no longer uses the legacy
# in-process Go sandboxRouter.
dataPlane:
  enabled: false
  log:
    maxSizeMB: 40
    maxFiles: 10
    queueCapacity: 32768
    flushIntervalMs: 200
    # Keep stdout enabled in Kubernetes for kubectl/container-runtime logs;
    # bounded service files are also written for node-level diagnostics.
    stdout: true
  commandWatch:
    maxSubscriptionsPerConnection: 4096
    queueCapacity: 256
    maxFrameBytes: 1048576
    pingIntervalSeconds: 20
  commandActivity:
    timeoutSeconds: 30
  rrtCommand:
    resultTtlSeconds: 3600
    stdoutLimitBytes: 4194304
    stderrLimitBytes: 4194304
    registryMaxRecords: 4096
    registryMaxBytes: 268435456
    registryMemoryHighWatermarkBytes: 201326592
    activityHeartbeatSeconds: 10
  edge:
    enabled: true
    tlsPort: 8443
    plainPort: 8080
    healthPort: 18080
    service:
      type: ClusterIP
      tlsPort: 8443
      plainPort: 8080
      annotations: {}
    tls:
      # Edge terminates public TLS itself; point this at a kubernetes.io/tls Secret.
      secretName: ""
    # Direct is fixed to TLS plus a token. Tunnel and port-forwarding default
    # to the plaintext listener without a token; route policy may require the
    # TLS listener and token for individual targets.
    validateIam: true
    iamAddress: ""
    authCacheTtlSeconds: 30
    defaultDirectPort: 50090
    defaultTunnelPort: 8765
    backendHttpPool:
      maxConnectionsPerEndpoint: 64
      maxIdleConnections: 1024
      maxIdleConnectionsPerEndpoint: 64
      idleTimeoutSeconds: 5
      acquireTimeoutMilliseconds: 3000
    # All entries forward to the co-located Frontend. Add an entry and roll the
    # Edge pod to extend the static control-plane surface without a code change.
    controlPlaneRoutes:
      - exact:/
      - exact:/healthz
      - prefix:/terminal
      - prefix:/api/instances
      - prefix:/api/jobs
      - prefix:/api/sandbox
      - prefix:/functions
      - prefix:/api-docs
      - prefix:/admin/v1/functions
      - prefix:/serverless/v1/functions
      - prefix:/serverless/v1/stream
      - prefix:/serverless/v1/componentshealth
      - prefix:/serverless/v1/posix
      - prefix:/frontend/v1/instance
      - prefix:/datasystem/v1
      - prefix:/serverless/v2
      - prefix:/app/v1
      - prefix:/client/v1/lease
      - prefix:/invocations
      - prefix:/global-scheduler
    allowedClientCidrs:
      - 127.0.0.0/8
    allowAnyClient: false
    logLevel: info
    accessLogEnabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  node:
    port: 8443
    healthPort: 18443
    allowedTargetCidrs:
      - 172.16.0.0/12
    allowedEdgeCidrs: []
    allowAnyEdge: false
    logLevel: info
  # Edge-to-Node has two mutually exclusive modes:
  # network = plaintext H2/TCP admitted by the mandatory Edge CIDR boundary;
  # mtls = mutually authenticated TLS on top of the same network boundary.
  edgeNode:
    securityMode: network
    mtls:
      nodeServerSecret: ""
      edgeClientSecret: ""
      caSecret: ""
      serverName: ""

node:
  enabled: true
  securityContext:
    privileged: true
    allowPrivilegeEscalation: true
  serviceAccount:
    create: true
    name: ""
  ports:
    functionProxy:
      containerPort: 22772
      hostPort: 22772
    functionProxyGrpc:
      containerPort: 22773
      hostPort: 22773
    dsWorker:
      containerPort: 31501
      hostPort: 31501
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
  docker:
    storageDriver: overlay2
    rootHostPath: /var/lib/openyuanrong/yr-node-docker
  probes:
    readiness:
      tcpSocket:
        port: function-proxy
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    liveness:
      tcpSocket:
        port: function-proxy
      initialDelaySeconds: 120
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3

traefik:
  # Legacy optional deployment only. Frontend and Rust Edge expose their own
  # Services and do not require Traefik.
  enabled: false
  replicaCount: 1
  entryPoints:
    web:
      address: ":8888"
  httpProvider:
    entryPoint: web
    pollInterval: 5s
    pollTimeout: 5s
    masterForwardTimeoutMs: 3000
  service:
    type: LoadBalancer
    port: 8888
    targetPort: 8888
    annotations: {}
  tls:
    entryPoint:
      enabled: false
      certResolver: ""
      domains: []
    router:
      enabled: false
      certResolver: ""
      optionsName: ""
      domains: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  probes:
    readiness:
      tcpSocket:
        port: web
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    liveness:
      tcpSocket:
        port: web
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3

debug:
  sidecar:
    image:
      registry: swr.cn-southwest-2.myhuaweicloud.com/yuanrong-dev
      repository: busybox
      tag: "1.36"
      pullPolicy: IfNotPresent
    sessionDir: /tmp/yr_sessions
    command:
      - sh
      - -lc
      - while true; do sleep 3600; done

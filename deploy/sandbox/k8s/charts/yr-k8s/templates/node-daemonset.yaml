{{- include "yr-k8s.validateDataSystem" . }}
{{- if .Values.node.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "yr-k8s.componentName" (dict "root" . "component" "node") }}
  namespace: {{ include "yr-k8s.namespace" . }}
  labels:
    {{- include "yr-k8s.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        {{- include "yr-k8s.labels" . | nindent 8 }}
        app.kubernetes.io/component: node
      annotations:
        checksum/components: {{ include (print $.Template.BasePath "/components-configmap.yaml") . | sha256sum }}
        checksum/services: {{ tpl .Values.global.services.servicesYaml . | sha256sum }}
    spec:
{{- include "yr-k8s.imagePullSecrets" . | nindent 6 }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ include "yr-k8s.serviceAccountName" (dict "root" . "component" "node" "values" .Values.node) }}
      containers:
        - name: node
          image: {{ include "yr-k8s.image" (dict "root" . "image" .Values.global.images.node) }}
          imagePullPolicy: {{ .Values.global.images.node.pullPolicy }}
{{- with .Values.node.securityContext }}
          securityContext:
{{ toYaml . | nindent 12 }}
{{- end }}
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: YR_ETCD_ADDR_LIST
              value: {{ include "yr-k8s.etcdAddrList" . | quote }}
            - name: YR_MASTER_IP
              value: {{ include "yr-k8s.componentName" (dict "root" . "component" "master-access") }}
            - name: FUNCTION_PROXY_PORT
              value: {{ .Values.node.ports.functionProxy.containerPort | quote }}
            - name: FUNCTION_PROXY_GRPC_PORT
              value: {{ .Values.node.ports.functionProxyGrpc.containerPort | quote }}
            - name: YR_DATASYSTEM_DEPLOYED
              value: {{ .Values.global.dataSystem.enabled | quote }}
            - name: YR_BYPASS_DATASYSTEM
              value: {{ .Values.global.dataSystem.bypass | quote }}
{{- if .Values.global.dataSystem.enabled }}
            - name: DS_WORKER_PORT
              value: {{ .Values.node.ports.dsWorker.containerPort | quote }}
{{- end }}
            - name: DOCKER_DRIVER
              value: {{ .Values.node.docker.storageDriver | quote }}
            - name: YR_ENABLE_TRAEFIK_REGISTRY
              value: {{ .Values.traefik.enabled | quote }}
            - name: YR_DATA_PLANE_NODE_PROXY_ENABLED
              value: {{ .Values.dataPlane.enabled | quote }}
{{- if .Values.dataPlane.enabled }}
            - name: YR_COMMAND_RECOVERY_ENABLED
              value: "true"
            - name: YR_COMMAND_ACTIVITY_TIMEOUT_SECS
              value: {{ .Values.dataPlane.commandActivity.timeoutSeconds | quote }}
            - name: YR_DATA_PLANE_NODE_PROXY_BIND
              value: {{ printf "0.0.0.0:%v" .Values.dataPlane.node.port | quote }}
            - name: YR_DATA_PLANE_NODE_PROXY_HEALTH_BIND
              value: {{ printf "127.0.0.1:%v" .Values.dataPlane.node.healthPort | quote }}
            - name: YR_DATA_PLANE_ALLOWED_TARGET_CIDRS
              value: {{ join "," .Values.dataPlane.node.allowedTargetCidrs | quote }}
            - name: YR_DATA_PLANE_ALLOWED_EDGE_CIDRS
              value: {{ join "," .Values.dataPlane.node.allowedEdgeCidrs | quote }}
            - name: YR_DATA_PLANE_NODE_PROXY_ALLOW_ANY_EDGE
              value: {{ .Values.dataPlane.node.allowAnyEdge | quote }}
            - name: YR_DATA_PLANE_EDGE_FRONTEND_NODE_SECURITY_MODE
              value: {{ .Values.dataPlane.edgeNode.securityMode | quote }}
{{- if and .Values.dataPlane.enabled (eq .Values.dataPlane.edgeNode.securityMode "mtls") }}
            - name: YR_DATA_PLANE_NODE_PROXY_TLS_CERT
              value: /etc/yr-data-plane-mtls/server/tls.crt
            - name: YR_DATA_PLANE_NODE_PROXY_TLS_KEY
              value: /etc/yr-data-plane-mtls/server/tls.key
            - name: YR_DATA_PLANE_NODE_PROXY_MTLS_CLIENT_CA
              value: /etc/yr-data-plane-mtls/ca/ca.crt
{{- end }}
            - name: YR_DATA_PLANE_NODE_PROXY_ACTIVITY_UDS_DIR
              value: /openyuanrong/run/data-plane-gateway/activity
            - name: YR_DATA_PLANE_NODE_PROXY_LOG_LEVEL
              value: {{ .Values.dataPlane.node.logLevel | quote }}
            - name: YR_DATA_PLANE_LOG_DIR
              value: /openyuanrong/logs/data-plane
            - name: YR_DATA_PLANE_LOG_MAX_SIZE_MB
              value: {{ .Values.dataPlane.log.maxSizeMB | quote }}
            - name: YR_DATA_PLANE_LOG_MAX_FILES
              value: {{ .Values.dataPlane.log.maxFiles | quote }}
            - name: YR_DATA_PLANE_LOG_QUEUE_CAPACITY
              value: {{ .Values.dataPlane.log.queueCapacity | quote }}
            - name: YR_DATA_PLANE_LOG_FLUSH_INTERVAL_MS
              value: {{ .Values.dataPlane.log.flushIntervalMs | quote }}
            - name: YR_DATA_PLANE_LOG_STDOUT
              value: {{ .Values.dataPlane.log.stdout | quote }}
{{- end }}
          ports:
            - name: function-proxy
              containerPort: {{ .Values.node.ports.functionProxy.containerPort }}
              hostPort: {{ .Values.node.ports.functionProxy.hostPort }}
              protocol: TCP
            - name: proxy-grpc
              containerPort: {{ .Values.node.ports.functionProxyGrpc.containerPort }}
              hostPort: {{ .Values.node.ports.functionProxyGrpc.hostPort }}
              protocol: TCP
{{- if .Values.global.dataSystem.enabled }}
            - name: ds-worker
              containerPort: {{ .Values.node.ports.dsWorker.containerPort }}
              hostPort: {{ .Values.node.ports.dsWorker.hostPort }}
              protocol: TCP
{{- end }}
{{- if .Values.dataPlane.enabled }}
            - name: data-plane-node
              containerPort: {{ .Values.dataPlane.node.port }}
              hostPort: {{ .Values.dataPlane.node.port }}
              protocol: TCP
{{- end }}
{{- with .Values.node.probes.readiness }}
          readinessProbe:
{{ toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.node.probes.liveness }}
          livenessProbe:
{{ toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.node.resources }}
          resources:
{{ toYaml . | nindent 12 }}
{{- end }}
          volumeMounts:
            - name: node-workdir
              mountPath: /openyuanrong
            - name: shm
              mountPath: /dev/shm
            - name: components
              mountPath: /etc/yuanrong/config.toml
              subPath: config.toml
            - name: services-config
              mountPath: /home/sn/service-config/services.yaml
              subPath: services.yaml
              readOnly: true
            - name: runtime-secret
              mountPath: /home/sn/secret
              readOnly: true
            - name: session-dir
              mountPath: {{ .Values.debug.sidecar.sessionDir }}
            - name: docker-root
              mountPath: /var/lib/docker
{{- if and .Values.dataPlane.enabled (eq .Values.dataPlane.edgeNode.securityMode "mtls") }}
            - name: data-plane-mtls-ca
              mountPath: /etc/yr-data-plane-mtls/ca
              readOnly: true
            - name: data-plane-mtls-server
              mountPath: /etc/yr-data-plane-mtls/server
              readOnly: true
{{- end }}
        - name: debug-busybox
          image: {{ include "yr-k8s.image" (dict "root" . "image" .Values.debug.sidecar.image) }}
          imagePullPolicy: {{ .Values.debug.sidecar.image.pullPolicy }}
          command:
{{ toYaml .Values.debug.sidecar.command | nindent 12 }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: node-workdir
              mountPath: /openyuanrong
            - name: shm
              mountPath: /dev/shm
            - name: components
              mountPath: /etc/yuanrong/config.toml
              subPath: config.toml
            - name: services-config
              mountPath: /home/sn/service-config/services.yaml
              subPath: services.yaml
              readOnly: true
            - name: runtime-secret
              mountPath: /home/sn/secret
              readOnly: true
            - name: session-dir
              mountPath: {{ .Values.debug.sidecar.sessionDir }}
      volumes:
        - name: node-workdir
          hostPath:
            path: /openyuanrong
            type: DirectoryOrCreate
        - name: shm
          emptyDir: {}
        - name: components
          configMap:
            name: {{ include "yr-k8s.fullname" . }}-components
        - name: services-config
          configMap:
            name: {{ include "yr-k8s.componentName" (dict "root" . "component" "services") }}
            items:
              - key: services.yaml
                path: services.yaml
        - name: runtime-secret
          secret:
            secretName: {{ include "yr-k8s.fullname" . }}-runtime
        - name: session-dir
          emptyDir: {}
        - name: docker-root
          hostPath:
            path: {{ .Values.node.docker.rootHostPath | quote }}
            type: DirectoryOrCreate
{{- if and .Values.dataPlane.enabled (eq .Values.dataPlane.edgeNode.securityMode "mtls") }}
        - name: data-plane-mtls-ca
          secret:
            secretName: {{ .Values.dataPlane.edgeNode.mtls.caSecret }}
        - name: data-plane-mtls-server
          secret:
            secretName: {{ .Values.dataPlane.edgeNode.mtls.nodeServerSecret }}
{{- end }}
{{- end }}

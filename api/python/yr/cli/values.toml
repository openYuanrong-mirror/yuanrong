[values]
host_ip = "{{ ip }}"
# In-node address used by runtimes and local services to reach Function Proxy.
local_ip = "{{ ip }}"
deploy_path = "{{ deploy_path }}"
yr_package_path = "{{ yr_package_path }}"
ds_bin = "{{ ds_bin }}"
faas_root = "{{ faas_root }}"
cpu_num = "{{ cpu_millicores }}" # in millicores
memory_num = "{{ memory_num_mb }}" # in MB
shared_memory_num = "{{ memory_num_mb // 3 }}" # in MB
node_id = "{{ node_id }}"
log_level = "INFO"
pid = "{{ pid }}"
ld_library_path = "{{ ld_library_path }}"
python_path = "{{ python_path }}"

[values.metrics]
metrics_config = ""
metrics_config_file = "{{ values.yr_package_path }}/functionsystem/config/metrics/metrics_config.json"

[values.meta_store]
enable = false
address = ""
mode = "local"

[values.fs]
schedule_plugins = '''["Label", "ResourceSelector", "Default", "Heterogeneous", "NUMA"]'''

[values.fs.log]
also_log_to_stderr = false
async_log_buf_secs = 30
async_log_max_queue_size = 51200
async_log_thread_count = 1
level = "{{ values.log_level }}"
path = "{{ values.deploy_path }}/logs/function_system"
rolling_max_files = 10
rolling_max_size = 40
rolling_retention_days = 30
compress_enable = false

[values.fs.tls]
enable = false
base_path = ""
ca_file = "ca.crt"
cert_file = "module.crt"
key_file = "module.key"

[values.fs.metrics]
metrics_config = ""
metrics_config_file = "{{ values.yr_package_path }}/functionsystem/config/metrics/metrics_config.json"

[values.ds.curve]
enable = false
base_path = ""
cache_storage_auth_type = "Noauth" # Noauth, ZMQ, AK/SK
cache_storage_auth_enable = false

[values.etcd]
bin_path = "{{ values.yr_package_path }}/third_party/etcd/etcd"
enable_multi_master = false
auth_type = "Noauth"
table_prefix = ""

[values.etcd.auth]
base_path = ""
ca_file = "ca.crt"
cert_file = "server.crt"
key_file = "server.key"
client_cert_file = "client.crt"
client_key_file = "client.key"

[[values.etcd.address]]
ip = "{{ values.host_ip }}"
peer_port = "{{ 32380|check_port() }}"
port = "{{ 32379|check_port() }}"

[values.ds_master]
bin_path = "{{ values.yr_package_path }}/datasystem/datasystem_worker"
ip = "{{ values.host_ip }}"
port = "{{ 12123|check_port() }}"

[values.ds_worker]
bin_path = "{{ values.yr_package_path }}/datasystem/datasystem_worker"
ip = "{{ values.host_ip }}"
port = "{{ 31501|check_port() }}"
spill = false

[values.function_master]
bin_path = "{{ values.yr_package_path }}/functionsystem/bin/function_master"
ip = "{{ values.host_ip }}"
global_scheduler_port = "{{ 22770|check_port() }}"

[values.function_proxy]
bin_path = "{{ values.yr_package_path }}/functionsystem/bin/function_proxy"
ip = "{{ values.host_ip }}"
port = "{{ 22772|check_port() }}"
grpc_listen_port = "{{ 22773|check_port() }}"
component_grpc_port = "{{ 22774|check_port() }}"
advertise_frontend_proxy_create = true
# TCP tunnel (frontend SSH -> instance sshd). Listener enabled only when
# values.frontend.ssh_enable is true. Port uses check_port() so it auto-shifts
# on conflict; override via -s values.function_proxy.tcp_tunnel_port.
tcp_tunnel_port = "{{ 22775|check_port() }}"
tcp_tunnel_max_connections = 1024
command_activity_timeout_sec = 30

[values.node_proxy]
# Off by default. The same switch starts the standalone Node Proxy component
# and enables its activity source in FunctionSystem.
enabled = false
bin_path = "{{ values.yr_package_path }}/data_plane/bin/yr-node-proxy"
bind = "0.0.0.0:8443"
health_bind = "127.0.0.1:18443"
# Empty means <values.host_ip>:8443, derived from bind's port by the config
# template. Set this explicitly when the node advertises a different private IP.
advertise_address = ""
# Generic Node Proxy admission boundary. For the current sandbox adapter,
# configure this with the node-local sandbox bridge CIDRs.
allowed_target_cidrs = []
allowed_edge_cidrs = []
# Development escape hatch; production should keep false and configure CIDRs.
allow_any_edge = false
activity_uds_dir = "{{ values.deploy_path }}/run/data-plane-gateway/activity"
activity_interval_sec = 30
tls_cert = ""
tls_key = ""
# Optional CA used to require and verify Edge client certificates.
mtls_client_ca = ""
edge_security_mode = "network"
max_streams = 0
drain_timeout_sec = 30
log_level = "info"
log_dir = "{{ values.fs.log.path }}/data_plane"
log_rolling_max_size_mb = 40
log_rolling_max_files = 10
log_queue_capacity = 32768
log_flush_interval_ms = 200
# Process mode redirects stdout to a launcher file, so use the internally
# rotated service log as the authoritative sink.
log_stdout = false

[values.edge_frontend]
bin_path = "{{ values.yr_package_path }}/data_plane/bin/yr-edge-frontend"
# Empty uses values.etcd.address and values.etcd.auth_type. Production Edge
# deployments should normally configure the complete external endpoint list.
etcd_endpoints = []
etcd_tls_ca = ""
etcd_tls_cert = ""
etcd_tls_key = ""
etcd_tls_domain = ""
etcd_username = ""
etcd_password = ""
tls_bind = "0.0.0.0:8443"
plain_bind = "0.0.0.0:8080"
health_bind = "127.0.0.1:18080"
# Static control-plane routes are forwarded to the co-deployed Frontend and
# keep the public entry independent from Traefik.
frontend_address = "127.0.0.1:8888"
# Optional JSON routes for additional HTTP applications (for example /grafana).
# Loaded at Edge startup; an empty path keeps only the legacy Frontend routes.
proxy_routes_file = ""
proxy_max_idle_connections = 512
proxy_idle_timeout_sec = 30
proxy_connect_timeout_sec = 5
# Matching is boundary-aware: prefix:/api also matches /api/v1, but not
# /api-escape. Update this list and restart Edge; no Rust code change is needed.
control_plane_routes = [
  "exact:/",
  "exact:/healthz",
  "prefix:/terminal",
  "prefix:/api/instances",
  "prefix:/api/jobs",
  "prefix:/api/sandbox",
  "prefix:/functions",
  "prefix:/api-docs",
  "prefix:/admin/v1/functions",
  "prefix:/serverless/v1/functions",
  "prefix:/serverless/v1/stream",
  "prefix:/serverless/v1/componentshealth",
  "prefix:/serverless/v1/posix",
  "prefix:/frontend/v1/instance",
  "prefix:/datasystem/v1",
  "prefix:/serverless/v2",
  "prefix:/app/v1",
  "prefix:/client/v1/lease",
  "prefix:/invocations",
  "prefix:/global-scheduler",
]
# Direct always uses this TLS listener. Tunnel and port-forwarding may use the
# plaintext listener without a token unless their route requires authentication.
tls_cert = ""
tls_key = ""
validate_iam = true
iam_address = ""
auth_cache_ttl_sec = 30
default_direct_port = 50090
default_tunnel_port = 8765
node_security_mode = "network"
node_tls_ca = ""
node_tls_server_name = ""
node_tls_client_cert = ""
node_tls_client_key = ""
h2_connections_per_node = 2
h2_max_connections_per_node = 4
# HTTP/1.1 connections inside a sandbox are reused independently from the
# Edge-to-Node H2 pool. Idle connections are globally bounded and short-lived
# because an idle backend connection is still an open Node CONNECT stream.
backend_http_max_connections_per_endpoint = 64
backend_http_max_idle_connections = 1024
backend_http_max_idle_connections_per_endpoint = 64
backend_http_idle_timeout_sec = 5
backend_http_acquire_timeout_ms = 3000
drain_timeout_sec = 30
# Edge accepts clients only from these source networks. User identity still
# comes from a validated Authorization bearer token.
allowed_client_cidrs = []
# Development escape hatch; production should keep false and configure CIDRs.
allow_any_client = false
log_level = "info"
log_dir = "{{ values.fs.log.path }}/data_plane"
log_rolling_max_size_mb = 40
log_rolling_max_files = 10
log_queue_capacity = 32768
log_flush_interval_ms = 200
log_stdout = false
access_log_enabled = true
command_watch_max_subscriptions = 4096
command_watch_queue_capacity = 256
command_watch_max_frame_bytes = 1048576
command_watch_ping_interval_sec = 20
rrt_command_result_ttl_secs = 3600
rrt_command_stdout_limit_bytes = 4194304
rrt_command_stderr_limit_bytes = 4194304
rrt_command_registry_max_records = 4096
rrt_command_registry_max_bytes = 268435456
rrt_command_registry_memory_high_watermark_bytes = 201326592
rrt_command_activity_heartbeat_secs = 10

[values.runtime_launcher]
enable = false
socket = "/var/run/runtime-launcher.sock"
backend = "docker"
docker_host = "unix:///var/run/docker.sock"

[values.runtime]
default_write_mode = "NONE_L2_CACHE"

[values.function_agent]
bin_path = "{{ values.yr_package_path }}/functionsystem/bin/function_agent"
ip = "{{ values.host_ip }}"
port = "{{ 58866|check_port() }}"
data_system_enable = false
snapshot_storage_mode = "local_only"

[values.frontend]
bin_path = "{{ values.yr_package_path }}/runtime/service/go/bin/goruntime"
ip = "{{ values.host_ip }}"
port = "{{ 8888|check_port() }}"
# sandboxRouter (rrt direct L7 reverse proxy). Enabled here so the full-feature
# package's Test K8S exercises the akernel-sdk -> rrt direct path end to end.
# (Production default is off; flip back to false to ship off-by-default.)
sandbox_router_enable = true
sandbox_router_listen_port = 8080
sandbox_router_rrt_port = 50090
sandbox_router_enable_jwt = true
sandbox_router_validate_iam = true
# Optional. When omitted, follows values.fs.tls.enable for backward compatibility.
# ssl_enable = false
client_auth_type = "RequireAndVerifyClientCert"
enable_function_token_auth = false
# SSH bastion (frontend) + TCP tunnel (function_proxy) + platform pubkey mount.
# Off by default. sshproxy validates at startup that ssh_host_key /
# ssh_backend_key / ssh_backend_public_key_dir are present and readable when
# ssh_enable=true, and fails fast otherwise.
ssh_enable = false
# Independent TCP tunnel switch for wsproxy WS passthrough. When true the
# function_proxy tcp.tunnel listener starts WITHOUT requiring ssh_enable / SSH
# keys (WS auth is frontend JWT, not SSH). Override via
# -s values.frontend.enable_tcp_tunnel=true. The "SSH users keep their tunnel
# automatically" default is applied in config.toml.jinja via
# (enable_tcp_tunnel or ssh_enable), so this stays a plain bool (a templated
# string here would crash the no-override render path — see StrictUndefined).
enable_tcp_tunnel = false
# Require external client public-key auth (ssh_authorized_keys). Set false only
# in isolated test environments (NoClientAuth); never enables password login.
ssh_auth_enable = true
# Binds 0.0.0.0:2222 by design (external clients connect here). Constrain
# exposure via firewall/reverse proxy on the deployment side.
ssh_address = ":2222"
ssh_host_key = ""
ssh_authorized_keys = ""
ssh_backend_key = ""
ssh_max_connections = 1024
ssh_backend_public_key_dir = ""

[values.function_scheduler]
bin_path = "{{ values.yr_package_path }}/runtime/service/go/bin/goruntime"
ip = "{{ values.host_ip }}"
lease_port = "{{ 8889|check_port() }}"

[values.meta_service]
bin_path = "{{ values.yr_package_path }}/functionsystem/bin/meta_service"
ip = "{{ values.host_ip }}"
port = "{{ 31182|check_port() }}"
clusters = ""
config_path = "{{ values.yr_package_path }}/functionsystem/config/meta_service/meta_service_config.json"
log_config_path = "{{ values.yr_package_path }}/functionsystem/config/meta_service/meta_service_log_config.json"
ssl_enable = false
client_auth_type = "RequireAndVerifyClientCert"

[values.lite_scheduler]
enable = false
enable_all_tenants = false
enabled_tenants = []
enabled_functions = []
acquire_wait_timeout_ms = 3000

[values.dashboard]
bin_path = "{{ values.yr_package_path }}/functionsystem/bin/dashboard"
ip = "{{ values.host_ip }}"
port = "{{ 9080|check_port() }}"
grpc_port = "{{ 9081|check_port() }}"
config_path = "{{ values.yr_package_path }}/dashboard/dashboard_config.json"

[values.dashboard.auth]
enable = false
cert_file = ""
key_file = ""

[values.dashboard.prometheus]
address = ""

[values.dashboard.prometheus.auth]
enable = false
base_path = ""
ca_file = ""
cert_file = ""
key_file = ""

[values.collector]
bin_path = "{{ values.yr_package_path }}/functionsystem/bin/collector"
ip = "{{ values.host_ip }}"
port = "{{ 9082|check_port() }}"

[values.iam_server]
ip = "{{ values.host_ip }}"
port = "{{ 31112|check_port() }}"

[values.auth]
provider = "casdoor" # casdoor or keycloak

[values.auth.casdoor]
enabled = false
endpoint = "http://127.0.0.1:8000"
public_endpoint = "" # defaults to endpoint if empty
client_id = ""
client_secret = ""
organization = "yuanrong"
application = "app-yuanrong"
admin_user = ""
admin_password = ""
jwt_public_key = ""

[values.auth.keycloak]
enabled = false
url = ""
internal_url = "" # defaults to url if empty
issuer_url = "" # defaults to url if empty
realm = "yuanrong"
client_id = "frontend"
client_secret = ""
